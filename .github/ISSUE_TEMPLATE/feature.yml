name: Запрос на улучшение
description: Проверяемое предложение для учебного продукта
title: "[Улучшение] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решаем
      description: Укажите пользователя и затруднение.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Перечислите наблюдаемые условия готовности.
    validations:
      required: true
 - type: textarea
    id: constraints
    attributes:
      label: Ограничения и исключения
    validations:
      required: true
